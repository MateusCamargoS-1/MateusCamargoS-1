<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#050816"/><stop offset=".62" stop-color="#0A1730"/><stop offset="1" stop-color="#160A25"/></linearGradient>
    <linearGradient id="accent" x1="70" y1="150" x2="700" y2="220" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset=".57" stop-color="#8BE9FD"/><stop offset="1" stop-color="#FF79C6"/></linearGradient>
    <linearGradient id="stroke" x1="30" y1="0" x2="1170" y2="320" gradientUnits="userSpaceOnUse"><stop stop-color="#00E5FF" stop-opacity=".8"/><stop offset=".5" stop-color="#00E5FF" stop-opacity=".12"/><stop offset="1" stop-color="#FF79C6" stop-opacity=".8"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#00E5FF" stop-opacity=".24"/><stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#8BE9FD" stroke-opacity=".06"/></pattern>
    <clipPath id="clip"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="960" cy="160" rx="300" ry="250" fill="url(#halo)" filter="url(#blur)"/>
    <path d="M0 264C198 222 312 290 502 254C682 220 790 58 1200 104" stroke="#00E5FF" stroke-opacity=".12"/>
    <path d="M0 278C205 236 330 302 518 267C716 231 822 72 1200 117" stroke="#FF79C6" stroke-opacity=".08"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <text x="62" y="54" fill="#8BE9FD" font-size="10" letter-spacing="3">MATEUS CAMARGO / 2026</text>
      <text x="62" y="143" fill="url(#accent)" font-size="48" font-weight="700" letter-spacing="3">FULLSTACK</text>
      <text x="62" y="191" fill="#FFFFFF" font-size="44" font-weight="700" letter-spacing="2">ENGINEER</text>
      <text x="66" y="226" fill="#A7B7CC" font-size="12" letter-spacing="2">BUILDING DIGITAL PRODUCTS THAT MOVE WITH PURPOSE.</text>
      <text x="66" y="270" fill="#00E5FF" font-size="10" letter-spacing="2">REACT  ·  NODE  ·  NEST  ·  FLUTTER  ·  RUST</text>
    </g>

    <g transform="translate(960 160)">
      <circle r="128" fill="none" stroke="#8BE9FD" stroke-opacity=".08" stroke-dasharray="2 10"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/></circle>
      <circle r="96" fill="none" stroke="#FF79C6" stroke-opacity=".15" stroke-dasharray="1 8"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/></circle>
      <circle r="66" fill="none" stroke="url(#stroke)" stroke-opacity=".5" stroke-width="1.5"><animate attributeName="r" values="66;72;66" dur="4s" repeatCount="indefinite"/></circle>
      <path d="M-145 0H-75M75 0H145M0-145V-75M0 75V145" stroke="#8BE9FD" stroke-opacity=".5"/>
      <circle r="38" fill="#07152C" stroke="#00E5FF" stroke-opacity=".7" filter="url(#glow)"/>
      <text x="0" y="15" text-anchor="middle" fill="#FFFFFF" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="38" font-weight="700">MC</text>
      <circle cx="0" cy="-128" r="4" fill="#00E5FF" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/></circle>
      <circle cx="96" cy="0" r="3" fill="#FF79C6" filter="url(#glow)"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="6s" repeatCount="indefinite"/></circle>
    </g>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="2" fill="#6E829C">
      <text x="62" y="300">SYSTEMS / INTERFACES / DELIVERY</text><text x="1050" y="300">[ ONLINE ]</text>
    </g>
    <rect x="1" y="1" width="1198" height="318" rx="19" stroke="url(#stroke)" stroke-opacity=".55"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#stroke)" opacity=".8"><animate attributeName="y" values="0;318;0" dur="8s" repeatCount="indefinite"/></rect>
  </g>
</svg>
